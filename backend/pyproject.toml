[tool.poetry]
name = "teammatex"
version = "0.1.0"
description = "AI teammate that learns your codebase and works alongside your team"
authors = ["TeammateX Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "~3.12"
fastapi = "^0.115"
python-multipart = "^0.0.9"
uvicorn = { extras = ["standard"], version = "^0.30" }
gunicorn = "^22.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
alembic = "^1.13"
asyncpg = "^0.29"
psycopg2-binary = "^2.9"
pydantic = "^2.7"
pydantic-settings = "^2.3"
pyjwt = "^2.8"
python-jose = { extras = ["cryptography"], version = "^3.3" }
httpx = "^0.27"
celery = { extras = ["redis"], version = "^5.4" }
redis = "^5.0"
neo4j = "^5.24"
pgvector = "^0.3"
sentence-transformers = "^3.0"
openai = "^1.55"
litellm = "^1.50"
tree-sitter = "^0.23"
tree-sitter-python = "^0.23"
tree-sitter-javascript = "^0.23"
tree-sitter-typescript = "^0.23"
pydriller = "^2.6"
pygit2 = "^1.15"
cryptography = "^42.0"
structlog = "^24.4"
prometheus-client = "^0.20"
prometheus-fastapi-instrumentator = "^7.0"
watchfiles = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.26"
pytest-cov = "^5.0"
ruff = "^0.5"
black = "^24.4"
mypy = "^1.10"
factory-boy = "^3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is owned by the formatter (black); don't double-flag
    "B008",  # FastAPI relies on `= Depends(...)` / `= Query(...)` in defaults
    "E712",  # `== True/False` is how SQLAlchemy filters render `= true` in SQL
    "E402",  # a few deliberate late imports (sys.path setup, circular-import breaks)
    "E741",  # occasional short loop/lambda names; low signal
    "N806",  # local names like `Session = sessionmaker()` read fine
    "N812",  # idiomatic aliased imports (e.g. `functional as F`)
    "N814",  # camelCase re-imported as a constant, intentionally
    "B904",  # explicit `raise ... from` not enforced across the tree
    "B007",  # unused loop variables are readable as-is
    "B028",  # warnings.warn stacklevel is not required here
    "SIM117",  # nested `with` blocks are sometimes clearer than one combined line
    "SIM113",  # manual counters over enumerate() where it reads better
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # re-exports are intentional in package inits

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Run every async test AND fixture on one shared session event loop. The API
# fixtures (async engine, Neo4j driver) are session-scoped singletons; without a
# single loop, interleaved function-loop tests make pytest-asyncio swap the loop
# under them, so a later session-scoped test hits "got Future attached to a
# different loop" (the conversation/upload tests passed alone but failed in the
# full run). Both keys require pytest-asyncio >= 0.26.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

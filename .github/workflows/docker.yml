name: Docker

# CI: prove every image still builds on each PR (cache-only, no push).
# CD: on a push to master or a version tag, build multi-arch images and publish
#     them to the GitHub Container Registry (ghcr.io/<owner>/teammatex-<component>).
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Build contexts mirror docker-compose: the backend Dockerfiles COPY from
    # ./backend and the frontend Dockerfile from ./frontend, so the context must
    # be that subdir (not the repo root) or the COPY steps can't find their files.
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: docker/Dockerfile.api
            context: ./backend
          - component: worker
            dockerfile: docker/Dockerfile.worker
            context: ./backend
          - component: frontend
            dockerfile: docker/Dockerfile.frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      # The api/worker images are ~2.6 GB each (torch + sentence-transformers), which
      # overflows the runner's ~14 GB free disk mid-build (ResourceExhausted: no space
      # left on device). Reclaim the preinstalled toolchains we don't use first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only publish for pushes to master / tags — never for PRs from forks.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/teammatex-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=min (final layers only): mode=max would push the multi-GB torch
          # layers into the 10 GB GHA cache and add disk pressure during export.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=min,scope=${{ matrix.component }}
